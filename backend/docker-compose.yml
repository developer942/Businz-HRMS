services:
  payroll-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrm_payroll_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DB_REST_URL=${DB_REST_URL:-http://localhost:3001}
      - DB_REST_KEY=${DB_REST_KEY:-vps-local-rest-key}
      - DB_REST_SERVICE_KEY=${DB_REST_SERVICE_KEY:-vps-local-rest-key}
      - JWT_SECRET=${JWT_SECRET:-vrm-hrms-production-jwt-secret-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
