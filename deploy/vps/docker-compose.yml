services:
  postgres:
    image: postgres:16-alpine
    container_name: businz_hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/00-pre-supabase-compat.sql:/docker-entrypoint-initdb.d/00-pre-supabase-compat.sql:ro
      - ../../backend/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/99-vps-access.sql:/docker-entrypoint-initdb.d/99-vps-access.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hrms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: businz_hrms_postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrms}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in .env}
      PGRST_SERVER_PORT: 3000

  rest-proxy:
    image: nginx:1.27-alpine
    container_name: businz_hrms_rest_proxy
    restart: unless-stopped
    depends_on:
      - postgrest
    volumes:
      - ./nginx/rest-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: businz_hrms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rest-proxy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrms}
      DATABASE_SSL: "false"
      DB_REST_URL: http://rest-proxy:3001
      DB_REST_KEY: ${DB_REST_KEY:-vps-local-rest-key}
      DB_REST_SERVICE_KEY: ${DB_REST_KEY:-vps-local-rest-key}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-25000}

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DB_REST_URL: ""
        VITE_DB_REST_KEY: ${DB_REST_KEY:-vps-local-rest-key}
    container_name: businz_hrms_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - rest-proxy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
