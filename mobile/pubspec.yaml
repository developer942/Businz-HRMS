name: businz_hrms_mobile
description: BUSINZ Enterprise HRMS mobile application for Android and iOS.
publish_to: "none"
version: 1.2.12+23

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  camera: ^0.11.1
  image_picker: ^1.1.2
  geolocator: ^13.0.4
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/businz-logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../brand-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../brand-logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAFBFF"
  color_dark: "#0B1117"
  image: "../brand-logo.png"
  android_12:
    color: "#FAFBFF"
    color_dark: "#0B1117"
    image: "../brand-logo.png"
  ios: true
  android: true
